version: "3.9"

# Docker Compose configuration for DBTools integration tests.
# Usage:
#   docker compose up -d          # start all containers
#   docker compose down -v        # stop and remove containers + volumes
#
# The SQL Server container accepts the SA password below and creates
# a testDB database with a testUser login on first start.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbtools-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TestStrong!Passw0rd
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestStrong!Passw0rd' -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TestStrong!Passw0rd' -Q "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  sqlserver-setup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbtools-sqlserver-setup
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TestStrong!Passw0rd
    entrypoint: >
      bash -c '
      echo "Waiting for SQL Server to be ready...";
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "TestStrong!Passw0rd" -C -Q "CREATE DATABASE testDB;" 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "TestStrong!Passw0rd" -Q "CREATE DATABASE testDB;" 2>/dev/null;
      echo "Creating testUser login...";
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "TestStrong!Passw0rd" -C -Q "CREATE LOGIN testUser WITH PASSWORD = '\''123456'\''; ALTER SERVER ROLE sysadmin ADD MEMBER testUser;" 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P "TestStrong!Passw0rd" -Q "CREATE LOGIN testUser WITH PASSWORD = '\''123456'\''; ALTER SERVER ROLE sysadmin ADD MEMBER testUser;" 2>/dev/null;
      echo "Setup complete.";
      '