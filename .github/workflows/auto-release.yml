name: Auto Release Tag

# Creates a semver tag from DBTools.csproj Version when merged to dotnet-core,
# which triggers the Release workflow (build, pack, NuGet.org + GitHub Packages).

on:
  push:
    branches: [ dotnet-core ]
    paths:
      - 'DBTools/DBTools.csproj'
      - 'DBTools/Properties/AssemblyInfo.cs'

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag from package version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        run: |
          VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' DBTools/DBTools.csproj | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not read <Version> from DBTools/DBTools.csproj"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION (tag: v$VERSION)"

      - name: Create and push tag if missing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — Release workflow was already triggered for this version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG — Release workflow will build and publish to NuGet.org and GitHub Packages."
