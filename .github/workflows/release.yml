name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 1.4.0). Leave blank to use the tag name.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare configuration
        run: |
          cp DBTools/config.json.example DBTools/config.json
          cp DBToolsUnitTest/config.json.example DBToolsUnitTest/config.json

      - name: Restore
        run: dotnet restore DBTools.sln

      - name: Build
        run: dotnet build DBTools.sln --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test (unit tests only)
        run: dotnet test DBTools.sln --no-build --configuration Release --verbosity normal --filter "TestCategory!=Integration"

      - name: Pack
        run: |
          mkdir -p artifacts
          dotnet pack DBTools/DBTools.csproj -c Release -o ./artifacts --no-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build-test-pack
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Publish to GitHub Packages
        run: |
          shopt -s nullglob
          for pkg in artifacts/*.nupkg; do
            case "$pkg" in
              *.symbols.nupkg) continue ;;
            esac
            echo "Publishing $pkg to GitHub Packages..."
            dotnet nuget push "$pkg" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --skip-duplicate
          done

  publish-nuget-org:
    name: Publish to NuGet.org
    needs: build-test-pack
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not configured; skipping NuGet.org publish."
            echo "Add the API key at: https://www.nuget.org/account/apikeys"
            exit 0
          fi
          shopt -s nullglob
          for pkg in artifacts/*.nupkg; do
            case "$pkg" in
              *.symbols.nupkg) continue ;;
            esac
            echo "Publishing $pkg to NuGet.org..."
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  github-release:
    name: Create GitHub release
    needs: build-test-pack
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.nupkg
