name: CI

on:
  push:
    branches: [ dotnet-core, main, master, develop ]
  pull_request:
    branches: [ dotnet-core, main, master, develop ]

permissions:
  contents: read

jobs:
  # Fast unit-only job — no database required
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare configuration
        run: |
          cp DBTools/config.json.example DBTools/config.json
          cp DBToolsUnitTest/config.json.example DBToolsUnitTest/config.json

      - name: Restore
        run: dotnet restore DBTools.sln

      - name: Build
        run: dotnet build DBTools.sln --no-restore --configuration Release

      - name: Verify deterministic build output (#30)
        run: |
          set -euo pipefail
          dotnet build DBTools/DBTools.csproj -c Release --no-incremental
          cp DBTools/bin/Release/net8.0/DBTools.dll /tmp/dbtools-build1.dll
          dotnet build DBTools/DBTools.csproj -c Release --no-incremental
          cp DBTools/bin/Release/net8.0/DBTools.dll /tmp/dbtools-build2.dll
          sha256sum /tmp/dbtools-build1.dll /tmp/dbtools-build2.dll
          cmp -s /tmp/dbtools-build1.dll /tmp/dbtools-build2.dll
          echo "Deterministic build verified: DBTools.dll is byte-identical across rebuilds"

      - name: Run unit tests (exclude Integration category)
        run: |
          dotnet test DBTools.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --filter "TestCategory!=Integration"

  # Integration tests — runs database containers via Docker Compose
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare configuration
        run: |
          cp DBTools/config.json.example DBTools/config.json
          cp DBToolsUnitTest/config.json.example DBToolsUnitTest/config.json

      - name: Restore
        run: dotnet restore DBTools.sln

      - name: Build
        run: dotnet build DBTools.sln --no-restore --configuration Release

      - name: Start SQL Server and run setup
        run: |
          docker compose up -d sqlserver --wait
          docker compose up sqlserver-setup --abort-on-container-exit --exit-code-from sqlserver-setup

      - name: Wait for SQL Server to be ready
        run: |
          echo "Waiting for SQL Server to accept connections..."
          for i in $(seq 1 30); do
            if docker compose exec -T sqlserver bash -c "/opt/mssql-tools18/bin/sqlcmd -S localhost -U testUser -P 'Integration!123' -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U testUser -P 'Integration!123' -Q 'SELECT 1' 2>/dev/null"; then
              echo "SQL Server is ready!"
              exit 0
            fi
            echo "  Attempt $i/30: SQL Server not ready yet..."
            sleep 2
          done
          echo "SQL Server did not become ready in time."
          docker compose logs
          exit 1

      - name: Run integration tests (only Integration category)
        run: |
          dotnet test DBTools.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --filter "TestCategory=Integration"

      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans

  # Full test run for releases — runs all tests
  all-tests:
    name: All Tests (Full)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare configuration
        run: |
          cp DBTools/config.json.example DBTools/config.json
          cp DBToolsUnitTest/config.json.example DBToolsUnitTest/config.json

      - name: Restore
        run: dotnet restore DBTools.sln

      - name: Build
        run: dotnet build DBTools.sln --no-restore --configuration Release

      - name: Start SQL Server and run setup
        run: |
          docker compose up -d sqlserver --wait
          docker compose up sqlserver-setup --abort-on-container-exit --exit-code-from sqlserver-setup

      - name: Wait for SQL Server to be ready
        run: |
          echo "Waiting for SQL Server to accept connections..."
          for i in $(seq 1 30); do
            if docker compose exec -T sqlserver bash -c "/opt/mssql-tools18/bin/sqlcmd -S localhost -U testUser -P 'Integration!123' -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U testUser -P 'Integration!123' -Q 'SELECT 1' 2>/dev/null"; then
              echo "SQL Server is ready!"
              exit 0
            fi
            echo "  Attempt $i/30: SQL Server not ready yet..."
            sleep 2
          done
          echo "SQL Server did not become ready in time."
          docker compose logs
          exit 1

      - name: Run all tests
        run: |
          dotnet test DBTools.sln \
            --no-build \
            --configuration Release \
            --verbosity normal

      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans